<svg xmlns="http://www.w3.org/2000/svg"
     width="256" height="256"
     viewBox="0 0 256 256"
     fill="none"
     role="img"
     aria-label="充值">

  <defs>
    <linearGradient id="bg" x1="28" y1="22" x2="224" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#46B4FF"/>
      <stop offset="1" stop-color="#1468F5"/>
    </linearGradient>

    <linearGradient id="wallet" x1="72" y1="102" x2="190" y2="202" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF1FF"/>
    </linearGradient>

    <linearGradient id="card" x1="91" y1="74" x2="180" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5AAEFF"/>
      <stop offset="1" stop-color="#2174F3"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0A4CC0" flood-opacity=".18"/>
    </filter>
  </defs>

  <!-- 蓝色 Tag -->
  <rect x="12" y="12" width="232" height="232" rx="48" fill="url(#bg)"/>

  <!-- 卡片 -->
  <g filter="url(#shadow)">
    <rect x="78" y="76" width="100" height="58" rx="14" fill="url(#card)"/>
    <rect x="86" y="93" width="84" height="8" rx="4" fill="#F4F8FF" opacity=".95"/>
  </g>

  <!-- 钱包 -->
  <g filter="url(#shadow)">
    <rect x="58" y="105" width="140" height="100" rx="22" fill="url(#wallet)"/>
    <rect x="154" y="137" width="52" height="42" rx="12" fill="#F7FAFF"/>
    <circle cx="174" cy="158" r="8" fill="#2C83F6"/>
  </g>

  <!-- 充值加号 -->
  <g stroke="#247AF4" stroke-width="11" stroke-linecap="round">
    <path d="M128 139v42"/>
    <path d="M107 160h42"/>
  </g>

  <!-- 向下箭头 -->
  <g>
    <circle cx="128" cy="69" r="27" fill="#FFFFFF"/>
    <path d="M128 54v25" stroke="#2178F5" stroke-width="9" stroke-linecap="round"/>
    <path d="M116 70l12 12 12-12" stroke="#2178F5" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

</svg>